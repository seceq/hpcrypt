[package]
name = "hpcrypt-hpke"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "HPKE (Hybrid Public Key Encryption) implementation - RFC 9180"
keywords = ["cryptography", "hpke", "encryption", "rfc9180", "no_std"]
categories = ["cryptography", "no-std"]

[dependencies]
hpcrypt-core = { workspace = true }
hpcrypt-curves = { path = "../hpcrypt-curves", version = "0.1.0" }
hpcrypt-kdf = { path = "../hpcrypt-kdf", version = "0.1.0" }
hpcrypt-aead = { path = "../hpcrypt-aead", version = "0.1.0" }
hpcrypt-hash = { path = "../hpcrypt-hash", version = "0.1.0" }
hpcrypt-mac = { path = "../hpcrypt-mac", version = "0.1.0" }
subtle = { workspace = true }
zeroize = { workspace = true }
rand = { version = "0.8", default-features = false }

[dev-dependencies]
hex-literal = { workspace = true }
rand = "0.8"
hpcrypt-cipher = { path = "../hpcrypt-cipher", version = "0.1.0" }

[features]
default = ["std"]
std = ["hpcrypt-core/std"]
alloc = ["hpcrypt-core/alloc"]
