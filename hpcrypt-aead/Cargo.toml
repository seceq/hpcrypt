[package]
name = "hpcrypt-aead"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Authenticated Encryption with Associated Data (AEAD) implementations for HPCrypt"
keywords.workspace = true
categories.workspace = true

[dependencies]
hpcrypt-core = { workspace = true }
hpcrypt-cipher = { workspace = true }
hpcrypt-mac = { workspace = true }
subtle = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
hex-literal = { workspace = true }
aes = "0.8"
criterion = { workspace = true }
wycheproof = "0.6"
serde_json = "1.0"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }

[features]
default = ["std", "alloc"]
std = ["hpcrypt-core/std", "hpcrypt-cipher/std", "hpcrypt-mac/std", "alloc"]
alloc = ["hpcrypt-core/alloc", "hpcrypt-cipher/alloc", "hpcrypt-mac/alloc"]

# Ascon-only build (NIST Lightweight Cryptography Winner)
# Excludes all other AEAD algorithms to minimize binary size
ascon-only = ["alloc"]
