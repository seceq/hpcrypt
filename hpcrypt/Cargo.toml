[package]
name = "hpcrypt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "High-performance cryptography library in pure Rust"
keywords.workspace = true
categories.workspace = true

[dependencies]
hpcrypt-core = { workspace = true }
hpcrypt-hash = { workspace = true, optional = true }
hpcrypt-mac = { workspace = true, optional = true }
hpcrypt-aead = { workspace = true, optional = true }
hpcrypt-cipher = { path = "../hpcrypt-cipher", version = "0.1.0", optional = true }
hpcrypt-kdf = { workspace = true, optional = true }
hpcrypt-curves = { workspace = true, optional = true }
hpcrypt-signatures = { workspace = true, optional = true }
hpcrypt-kex = { workspace = true, optional = true }
hpcrypt-rng = { workspace = true, optional = true }
hpcrypt-ecies = { path = "../hpcrypt-ecies", version = "0.1.0", optional = true }
hpcrypt-hpke = { path = "../hpcrypt-hpke", version = "0.1.0", optional = true }
hpcrypt-srp = { path = "../hpcrypt-srp", version = "0.1.0", optional = true }

[features]
default = ["std", "hash", "mac", "aead"]
std = [
    "hpcrypt-core/std",
    "hpcrypt-hash?/std",
    "hpcrypt-mac?/std",
    "hpcrypt-aead?/std",
    "hpcrypt-cipher?/std",
    "hpcrypt-kdf?/std",
    "hpcrypt-curves?/std",
    "hpcrypt-signatures?/std",
    "hpcrypt-kex?/std",
    "hpcrypt-rng?/std",
    "hpcrypt-ecies?/std",
    "hpcrypt-hpke?/std",
    "hpcrypt-srp?/std",
]
alloc = [
    "hpcrypt-core/alloc",
    "hpcrypt-hash?/alloc",
    "hpcrypt-mac?/alloc",
    "hpcrypt-aead?/alloc",
    "hpcrypt-cipher?/alloc",
    "hpcrypt-kdf?/alloc",
    "hpcrypt-curves?/alloc",
    "hpcrypt-signatures?/alloc",
    "hpcrypt-kex?/alloc",
    "hpcrypt-rng?/alloc",
    "hpcrypt-ecies?/alloc",
    "hpcrypt-hpke?/alloc",
    "hpcrypt-srp?/alloc",
]

# Algorithm categories
hash = ["dep:hpcrypt-hash"]
mac = ["dep:hpcrypt-mac"]
aead = ["dep:hpcrypt-aead"]
cipher = ["dep:hpcrypt-cipher"]
kdf = ["dep:hpcrypt-kdf"]
curves = ["dep:hpcrypt-curves"]
signatures = ["dep:hpcrypt-signatures"]
kex = ["dep:hpcrypt-kex"]
rng = ["dep:hpcrypt-rng", "hpcrypt-rng?/os-rng"]
ecies = ["dep:hpcrypt-ecies", "curves", "aead", "kdf"]
hpke = ["dep:hpcrypt-hpke", "curves", "aead", "kdf", "hash"]
srp = ["dep:hpcrypt-srp", "hash"]

