[package]
name = "hpcrypt-slhdsa"
version = "0.1.0"
edition = "2021"
authors = ["Maamoun"]
description = "High-performance implementation of SLH-DSA (SPHINCS+) in Rust with comprehensive testing and benchmarks"
license = "MIT OR Apache-2.0"
keywords = ["cryptography", "post-quantum", "signature", "sphincs", "slh-dsa"]
categories = ["cryptography", "no-std"]

[dependencies]
# HPCrypt dependencies
hpcrypt-rng = { path = "../hpcrypt-rng", default-features = false }
hpcrypt-hash = { path = "../hpcrypt-hash", default-features = false }

# Constant-time operations and zeroization
subtle = { version = "2.5", default-features = false }
zeroize = { version = "1.7", default-features = false, features = ["derive"] }

[dev-dependencies]
# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }

# Testing utilities
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"

[features]
default = ["std", "hpcrypt-rng/os-rng"]
std = ["hpcrypt-hash/std", "hpcrypt-rng/std", "subtle/std", "zeroize/std"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = false
debug = false
panic = "abort"

[profile.bench]
inherits = "release"
debug = true

[[bench]]
name = "keygen"
harness = false

[[bench]]
name = "sign"
harness = false

[[bench]]
name = "verify"
harness = false

