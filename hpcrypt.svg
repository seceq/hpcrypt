<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="seceqGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00b4d8"/>
      <stop offset="100%" style="stop-color:#023e8a"/>
    </linearGradient>
  </defs>
  
  <rect width="400" height="400" fill="#FFFFFF"/>
  
  <!-- Rounded square container -->
  <rect x="80" y="45" width="240" height="220" rx="45" fill="url(#seceqGrad)"/>
  
  <!-- Speed lines left - 3 staggered -->
  <g fill="#FFFFFF" opacity="0.8">
    <rect x="95" y="125" width="35" height="8" rx="4"/>
    <rect x="105" y="151" width="35" height="8" rx="4"/>
    <rect x="95" y="177" width="35" height="8" rx="4"/>
  </g>
  
  <!-- Hash symbol -->
  <g stroke="#FFFFFF" stroke-width="14" stroke-linecap="round">
    <line x1="182" y1="105" x2="178" y2="205"/>
    <line x1="222" y1="105" x2="218" y2="205"/>
    <line x1="155" y1="135" x2="245" y2="135"/>
    <line x1="155" y1="175" x2="245" y2="175"/>
  </g>
  
  <!-- Speed lines right - 3 staggered -->
  <g fill="#FFFFFF" opacity="0.8">
    <rect x="270" y="125" width="35" height="8" rx="4"/>
    <rect x="260" y="151" width="35" height="8" rx="4"/>
    <rect x="270" y="177" width="35" height="8" rx="4"/>
  </g>
  
  <text x="200" y="340" font-family="'IBM Plex Mono', monospace" font-size="36" font-weight="600" fill="#1C1C1C" text-anchor="middle" letter-spacing="2">HPCrypt</text>
  <text x="200" y="365" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="500" fill="#6B7280" text-anchor="middle" letter-spacing="3">HIGH-PERFORMANCE CRYPTOGRAPHY</text>
</svg>
