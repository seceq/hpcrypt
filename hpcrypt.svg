<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="seceqGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00b4d8"/>
      <stop offset="100%" style="stop-color:#023e8a"/>
    </linearGradient>
  </defs>
  
  <rect width="400" height="400" fill="#FFFFFF"/>
  
  <!-- Rounded square container -->
  <rect x="80" y="45" width="240" height="220" rx="45" fill="url(#seceqGrad)"/>
  
  <!-- Speed lines left - 3 staggered (7px) -->
  <g fill="#FFFFFF" opacity="0.8">
    <rect x="95" y="125" width="35" height="7" rx="3.5"/>
    <rect x="105" y="151" width="35" height="7" rx="3.5"/>
    <rect x="95" y="177" width="35" height="7" rx="3.5"/>
  </g>
  
  <!-- Hash symbol (thinner and smaller) -->
  <g stroke="#FFFFFF" stroke-width="10" stroke-linecap="round">
    <line x1="185" y1="115" x2="182" y2="195"/>
    <line x1="218" y1="115" x2="215" y2="195"/>
    <line x1="162" y1="140" x2="238" y2="140"/>
    <line x1="162" y1="172" x2="238" y2="172"/>
  </g>
  
  <!-- Speed lines right - 3 staggered (7px) -->
  <g fill="#FFFFFF" opacity="0.8">
    <rect x="270" y="125" width="35" height="7" rx="3.5"/>
    <rect x="260" y="151" width="35" height="7" rx="3.5"/>
    <rect x="270" y="177" width="35" height="7" rx="3.5"/>
  </g>
  
  <text x="200" y="320" font-family="'IBM Plex Mono', monospace" font-size="36" font-weight="600" fill="#1C1C1C" text-anchor="middle" letter-spacing="2">HPCrypt</text>
  <text x="200" y="345" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="500" fill="#6B7280" text-anchor="middle" letter-spacing="3">HIGH-PERFORMANCE CRYPTOGRAPHY</text>
</svg>
