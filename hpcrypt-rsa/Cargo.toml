[package]
name = "hpcrypt-rsa"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
hpcrypt-core = { path = "../hpcrypt-core", version = "0.1.0" }
hpcrypt-hash = { path = "../hpcrypt-hash", version = "0.1.0" }
hpcrypt-rng = { path = "../hpcrypt-rng", version = "0.1.0" }
num-bigint = { version = "0.4", default-features = false, features = ["rand"] }
num-traits = { version = "0.2", default-features = false }
num-integer = { version = "0.1", default-features = false }
num-prime = { version = "0.4", default-features = false }
subtle = "2.5"
zeroize = { version = "1.7", features = ["derive"] }
sha2 = { version = "0.10", optional = true, default-features = false }
rand = { version = "0.8", optional = true, default-features = false, features = ["std_rng"] }

[dev-dependencies]
hex-literal = "0.4"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
sha2 = "0.10"

[features]
default = ["std", "sha2"]
std = ["hpcrypt-core/std", "num-bigint/std", "num-traits/std", "num-integer/std", "sha2?/std", "rand"]
alloc = []
