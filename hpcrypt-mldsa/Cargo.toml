[package]
name = "hpcrypt-mldsa"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["HPCrypt Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/hpcrypt"
homepage = "https://github.com/yourusername/hpcrypt"
documentation = "https://docs.rs/hpcrypt-mlkem"
readme = "README.md"
description = "ML-KEM (Module-Lattice-Based Key Encapsulation Mechanism) implementation per NIST FIPS 203 - Pure Rust portable implementation"
keywords = ["cryptography", "post-quantum", "ml-kem", "kyber", "kem"]
categories = ["cryptography", "no-std"]

[dependencies]
# Use hpcrypt crates for hash and RNG
hpcrypt-core = { workspace = true, default-features = false }
hpcrypt-hash = { path = "../hpcrypt-hash", default-features = false, features = ["std"] }
hpcrypt-rng = { path = "../hpcrypt-rng", default-features = false, features = ["os-rng"] }
getrandom = { version = "0.2", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"], optional = true }
zeroize = { version = "1.8", default-features = false, features = ["alloc"], optional = true }

[dev-dependencies]
hex = "0.4"
rand = "0.8"
proptest = "1.6"
criterion = { version = "0.5", features = ["html_reports"] }
serde_json = "1.0"

[lib]
name = "hpcrypt_mldsa"
path = "src/lib.rs"

[features]
default = []
std = ["hpcrypt-core/std", "hpcrypt-hash/std", "getrandom/std"]
serde = ["dep:serde"]
zeroize = ["dep:zeroize"]
timing-tests = []
cavp = []
# SIMD optimizations
avx2 = []
neon = []

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = false

[profile.bench]
inherits = "release"
