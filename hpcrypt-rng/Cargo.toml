[package]
name = "hpcrypt-rng"
version = "0.1.0"
edition = "2021"
rust-version = "1.65"
authors = ["HPCrypt Contributors"]
license = "MIT OR Apache-2.0"
description = "Cryptographically secure random number generation for HPCrypt"
repository = "https://github.com/[username]/hpcrypt"
keywords = ["crypto", "rng", "random", "csprng", "no-std"]
categories = ["cryptography", "no-std"]

[dependencies]
# Core dependency for OS random number generation
getrandom = { version = "0.2", default-features = false }

# For compatibility with rand ecosystem
rand_core = { version = "0.6", default-features = false }

# For zeroization of sensitive material
zeroize = { version = "1.7", default-features = false, features = ["alloc"] }

# For constant-time operations
subtle = { version = "2.5", default-features = false }

# Intel RDRAND/RDSEED hardware RNG support
rdrand = { version = "0.8", optional = true }

# DRBG dependencies
hpcrypt-cipher = { path = "../hpcrypt-cipher", default-features = false, optional = true }
hpcrypt-hash = { path = "../hpcrypt-hash", default-features = false, optional = true }
hpcrypt-mac = { path = "../hpcrypt-mac", default-features = false, optional = true }

[dev-dependencies]
# For testing randomness quality
rand = "0.8"

[features]
default = ["std", "os-rng"]
std = ["getrandom/std", "zeroize/std"]
alloc = ["zeroize/alloc"]

# OS-based RNG (default, recommended)
os-rng = ["getrandom/std"]

# WASM support
wasm = ["getrandom/js"]

# Hardware DRBG implementations
rdrand-drbg = ["rdrand"]
rdseed-drbg = ["rdrand"]

# NIST SP 800-90A compliant DRBGs
ctr-drbg = ["hpcrypt-cipher", "alloc"]
hash-drbg = ["hpcrypt-hash", "alloc"]
hmac-drbg = ["hpcrypt-mac", "alloc"]
chacha20-drbg = ["hpcrypt-cipher", "alloc"]

# Enable all DRBGs
drbg = ["ctr-drbg", "hash-drbg", "hmac-drbg"]
drbg-all = ["drbg", "chacha20-drbg", "rdrand-drbg", "rdseed-drbg"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
