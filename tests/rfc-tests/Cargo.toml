[package]
name = "rfc-tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# Workspace dependencies for testing
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
rand = "0.8"

# HPCrypt crates to test (optional, enabled via features)
hpcrypt-hpke = { workspace = true, features = ["std"], optional = true }
hpcrypt-pake = { workspace = true, features = ["std", "alloc"], optional = true }
hpcrypt-kdf = { workspace = true, features = ["std", "quic-header-protection"], optional = true }
hpcrypt-srp = { workspace = true, features = ["std"], optional = true }
hpcrypt-hash = { workspace = true, features = ["std"], optional = true }
hpcrypt-ecies = { workspace = true, features = ["std"], optional = true }
hpcrypt-threshold = { workspace = true, features = ["std"], optional = true }
hpcrypt-aead = { workspace = true, features = ["std"], optional = true }
hpcrypt-cipher = { workspace = true, features = ["std"], optional = true }
hpcrypt-mac = { workspace = true, features = ["std", "alloc"], optional = true }
hpcrypt-signatures = { workspace = true, features = ["std"], optional = true }
hpcrypt-curves = { workspace = true, features = ["std"], optional = true }
hpcrypt-slhdsa = { workspace = true, features = ["std"], optional = true }
hpcrypt-mldsa = { workspace = true, features = ["std"], optional = true }
hpcrypt-mlkem = { workspace = true, features = ["std"], optional = true }
hpcrypt-rng = { workspace = true, optional = true }

[features]
default = []
enable-hpke-tests = ["hpcrypt-hpke"]
enable-aead-tests = ["hpcrypt-aead"]
enable-cipher-tests = ["hpcrypt-cipher"]
enable-mac-tests = ["hpcrypt-mac"]
enable-signature-tests = ["hpcrypt-signatures", "hpcrypt-curves"]
enable-opaque-tests = ["hpcrypt-pake"]
enable-kdf-tests = ["hpcrypt-kdf"]
enable-srp-tests = ["hpcrypt-srp"]
enable-hash-tests = ["hpcrypt-hash"]
enable-ecies-tests = ["hpcrypt-ecies"]
enable-shamir-tests = ["hpcrypt-threshold"]
enable-pqc-tests = ["hpcrypt-slhdsa", "hpcrypt-mldsa", "hpcrypt-mlkem", "hpcrypt-rng"]

# Enable all RFC implementation tests
enable-all-tests = [
    "enable-hpke-tests",
    "enable-opaque-tests",
    "enable-kdf-tests",
    "enable-srp-tests",
    "enable-hash-tests",
    "enable-ecies-tests",
    "enable-shamir-tests",
    "enable-aead-tests",
    "enable-cipher-tests",
    "enable-mac-tests",
    "enable-signature-tests",
    "enable-pqc-tests",
]

[lib]
path = "src/lib.rs"

# Individual test binaries
[[test]]
name = "hpke"
path = "tests/hpke.rs"
required-features = ["enable-hpke-tests"]

[[test]]
name = "opaque"
path = "tests/opaque.rs"
required-features = ["enable-opaque-tests"]


