[package]
name = "hpcrypt-hash"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Cryptographic primitives for HPCrypt"
keywords.workspace = true
categories.workspace = true

[dependencies]
hpcrypt-core = { workspace = true }

[dev-dependencies]
blake3 = "1.8.2"
hex-literal = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "shake_optimization"
harness = false

[[bench]]
name = "kmac_optimization_benchmarks"
harness = false

[[bench]]
name = "kmac_encoding_comparison"
harness = false

[[bench]]
name = "kmac_absorb_comparison"
harness = false

[[bench]]
name = "kmac_precomputed_comparison"
harness = false

[[bench]]
name = "keccak_f_comparison"
harness = false

[[bench]]
name = "keccak_step_level_comparison"
harness = false

[[bench]]
name = "kmac_const_generic_comparison"
harness = false

[[bench]]
name = "lane_complement_comparison"
harness = false

[[bench]]
name = "small_message_fast_path"
harness = false

[features]
default = ["std", "alloc"]
std = ["hpcrypt-core/std"]
alloc = ["hpcrypt-core/alloc"]
lane-complement = []
